name: Dependabot Auto-merge Triage (Reusable)

# ADR#05(dev-platform)の実装をreusable化したもの。
# マージの判断は dependabot-auto-merge-minor.yml(promoter)に集約する(#106)。
# ここでは区分ごとのラベルを付けるだけで、`gh pr merge --auto` は使わない
# (--auto は必須チェック=gitleaks のみを待ち、テストが赤でもマージするため。ADR-022)。
# - patch: `dependabot/patch-pending` ラベルを付け、promoter が全チェック成功を
#   確認してマージする(待機0h)
# - minor: `dependabot/minor-pending` ラベルを付け、24h待機後に
#   promoter が全チェック成功を確認してマージする
# - 0.x の minor: semver 0.x は minor が breaking 相当のため major 扱い(手動レビュー)
# - major: `dependabot/major` ラベルを付けるのみ。auto-mergeしない(手動レビュー)
# - セキュリティアドバイザリ付き(Dependabot security update)は
#   区分に関係なく auto-merge しない(手動レビュー最優先)
#
# 重要: このファイルは job-level permissions を宣言しない。
# reusable workflow に permissions を書くと、caller が独自の permissions を
# 宣言しておらず org default が read の場合に workflow 全体が startup_failure に
# なる事故が起きたため(incident: qa-workflows#772, 2026-09-06)。
# caller は必ず自分の workflow 側で
#   permissions:
#     contents: write
#     pull-requests: write
# を明示的に宣言すること(下記 caller 例参照)。

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          実行 runner。未指定なら vars.GATE_RUNNER を使う
          （caller は通常渡さない）
        type: string
        default: ""
    secrets:
      alert-token:
        description: >-
          Dependabot alerts 読み取り権限(Dependabot alerts: Read only)を持つ PAT / App トークン。
          fetch-metadata の alert-lookup は github.token では動かないため、これを渡した場合のみ
          セキュリティアドバイザリ付き更新を検出して auto-merge から除外できる。
          未指定だとセキュリティ更新も通常の patch/minor と同じ扱いになる。
        required: false

# --- caller側の例 ---
# name: Dependabot Auto-merge
# on:
#   pull_request:
#     types: [opened, synchronize, reopened]
# permissions:
#   contents: write
#   pull-requests: write
# jobs:
#   triage:
#     if: github.actor == 'dependabot[bot]'
#     uses: flipslidersand-labs/qa-workflows/.github/workflows/dependabot-auto-merge.yml@main

jobs:
  triage:
    runs-on: ${{ inputs.runner != '' && inputs.runner || vars.GATE_RUNNER }}
    steps:
      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        # checkout 無しで実行するため、gh がリポを推定できない（fatal: not a git repository）。
        # --repo を明示する（#41）
        run: |
          gh label create "dependabot/security-review" --repo "$GITHUB_REPOSITORY" --color D93F0B \
            --description "セキュリティアドバイザリ付き更新。手動レビュー必須" --force
          gh label create "dependabot/patch-pending" --repo "$GITHUB_REPOSITORY" --color FBCA04 \
            --description "patch更新。全チェック成功を待ってpromoterがマージ" --force
          gh label create "dependabot/minor-pending" --repo "$GITHUB_REPOSITORY" --color FBCA04 \
            --description "minor更新。24h待機後、全チェック成功を待ってpromoterがマージ" --force
          gh label create "dependabot/minor-promoted" --repo "$GITHUB_REPOSITORY" --color 0E8A16 \
            --description "minor更新。24h経過しauto-merge有効化済み" --force
          gh label create "dependabot/major" --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "major更新。auto-merge対象外・手動レビュー必須" --force

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          # alert-lookup(ghsa-id 等の取得)は PAT / App トークン必須。alert-token 未指定時は無効
          alert-lookup: ${{ secrets.alert-token != '' }}
          github-token: ${{ secrets.alert-token || github.token }}

      # ghsa-id(alert-token 指定時のみ取得可) または dependency-group 名に security を含むものを
      # セキュリティ更新とみなし、patch/minor の自動処理から除外する
      - name: Classify security update
        id: security
        env:
          GHSA_ID: ${{ steps.metadata.outputs.ghsa-id }}
          DEP_GROUP: ${{ steps.metadata.outputs.dependency-group }}
        run: |
          if [ -n "$GHSA_ID" ] || [[ "$DEP_GROUP" == *security* ]]; then
            echo "is-security=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-security=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Security advisory → 手動レビュー
        if: ${{ steps.security.outputs.is-security == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ github.event.pull_request.html_url }}" --add-label "dependabot/security-review"

      - name: patch → patch-pending ラベル(マージは promoter が全チェック成功を確認して実行)
        if: ${{ steps.security.outputs.is-security != 'true' && steps.metadata.outputs.update-type == 'version-update:semver-patch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ github.event.pull_request.html_url }}" --add-label "dependabot/patch-pending"

      - name: minor → 24h待機ラベル
        if: ${{ steps.security.outputs.is-security != 'true' && steps.metadata.outputs.update-type == 'version-update:semver-minor' && !startsWith(steps.metadata.outputs.new-version, '0.') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ github.event.pull_request.html_url }}" --add-label "dependabot/minor-pending"

      - name: 0.x の minor → 手動レビューラベル(semver 0.x は minor が breaking 相当)
        if: ${{ steps.security.outputs.is-security != 'true' && steps.metadata.outputs.update-type == 'version-update:semver-minor' && startsWith(steps.metadata.outputs.new-version, '0.') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ github.event.pull_request.html_url }}" --add-label "dependabot/major"

      - name: major → 手動レビューラベル
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-major' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ github.event.pull_request.html_url }}" --add-label "dependabot/major"
