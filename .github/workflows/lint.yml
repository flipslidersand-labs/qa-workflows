name: lint

# qa-workflows 自身の workflow を actionlint で検査する（#47）。
# reusable workflow は workflow_call のみで単体では実行されないため、
# YAML 構文・式の誤りが caller リポで初めて発覚するのを防ぐ（#35 / #40）。
# shellcheck 連携も有効（run: スクリプトの未クォート展開 SC2086 等を検出する、#90）。
# 既存の指摘は #78 で解消済みのため、全 workflow で 0 件を保つこと。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ${{ vars.GATE_RUNNER }}
    env:
      ACTIONLINT_VERSION: "1.7.12"
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION" "$RUNNER_TEMP"

      # actionlint は shellcheck が PATH に無いと run: の検査を黙ってスキップする。
      # self-hosted runner で有効化が空振りしたまま緑になるのを防ぐ。
      - name: Require shellcheck
        run: |
          command -v shellcheck >/dev/null || { echo "::error::shellcheck が runner に無い(actionlint の run: 検査がスキップされる)"; exit 1; }

      - name: Run actionlint
        run: |
          "$RUNNER_TEMP/actionlint" -color

      # `|| true`(失敗の握りつぶし)の検出(#116)。許容は行末 `# allow-true: 理由`。
      # 取得物が無く 0.01 秒のため actionlint ジョブに同居させる。
      - name: Check silent-failure idiom (allow-true required)
        run: |
          bash tests/check-or-true/run.sh
          bash scripts/check-or-true.sh

  # zizmor の限定 audit(zizmor.yml: dangerous-triggers / excessive-permissions / artipacked / cache-poisoning)(#116)。
  # --offline で約 0.1 秒。pip の ==バージョン固定で導入する(unpinned-uses 方針が決まるまで他の audit は外す)。
  zizmor:
    runs-on: ${{ vars.GATE_RUNNER }}
    env:
      ZIZMOR_VERSION: "1.31.1"
    steps:
      - uses: actions/checkout@v7

      - name: Install zizmor (pinned)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/pip" install --quiet "zizmor==${ZIZMOR_VERSION}"
          echo "$RUNNER_TEMP/zizmor-venv/bin" >> "$GITHUB_PATH"

      - name: Run zizmor (limited audits)
        run: bash scripts/run-zizmor.sh

  # dependabot 自動マージの判定(全チェック成功のゲート)の回帰テスト(#106)。
  # 判定本体は dependabot-auto-merge-minor.yml から取り出して固定データで検査する。
  # jq は runner に無い場合がある(DS1)ため、SHA256 固定で取得する(ADR-007 と同じ流儀)。
  auto-merge-gate-test:
    runs-on: ${{ vars.GATE_RUNNER }}
    env:
      JQ_VERSION: "1.7.1"
      JQ_SHA256: "5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5"
    steps:
      - uses: actions/checkout@v7

      - name: Install jq (sha256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jqbin"
          curl -fsSL -o "$RUNNER_TEMP/jqbin/jq" \
            "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-amd64"
          echo "${JQ_SHA256}  $RUNNER_TEMP/jqbin/jq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/jqbin/jq"
          echo "$RUNNER_TEMP/jqbin" >> "$GITHUB_PATH"

      - name: "Gate judgement (real PR fixtures and boundaries)"
        run: bash tests/auto-merge-gate/run.sh

      - name: "Promote step (gh stubbed - merge, label and dry-run branches)"
        run: bash tests/auto-merge-gate/run-loop.sh
