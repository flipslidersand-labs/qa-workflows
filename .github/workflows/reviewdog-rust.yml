name: Reviewdog Rust (Reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: lint 対象ディレクトリ
        type: string
        default: "."
      rust-version:
        description: Rust toolchain
        type: string
        default: "stable"
      clippy-args:
        description: cargo clippy のスコープ引数
        type: string
        default: "--workspace --all-targets"
      fail-on-error:
        description: >-
          true なら lint エラーで CI を落とす。false（デフォルト）は
          PR にインラインコメントを付けるだけで CI は落とさない
          （Phase後半で true に切り替える運用を想定 #774）
        type: boolean
        default: false

jobs:
  reviewdog:
    runs-on: ${{ vars.GATE_RUNNER }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ inputs.rust-version }}
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ inputs.working-directory }}

      # reviewdog/action-clippy は存在しない（#774 実装時の誤り）。
      # 実在する giraffate/clippy-action（reviewdog 連携済み）を使う
      - uses: giraffate/clippy-action@13b9d32482f25d29ead141b79e7e04e7900281e0 # v1
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added
          fail_on_error: ${{ inputs.fail-on-error }}
          workdir: ${{ inputs.working-directory }}
          clippy_flags: ${{ inputs.clippy-args }}
