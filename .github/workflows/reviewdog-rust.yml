name: Reviewdog Rust (Reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: lint 対象ディレクトリ
        type: string
        default: "."
      rust-version:
        description: Rust toolchain
        type: string
        default: "stable"
      clippy-args:
        description: cargo clippy のスコープ引数
        type: string
        default: "--workspace --all-targets"
      fail-on-error:
        description: >-
          true なら lint エラーで CI を落とす。false（デフォルト）は
          PR にインラインコメントを付けるだけで CI は落とさない
          （Phase後半で true に切り替える運用を想定 #774）
        type: boolean
        default: false

jobs:
  reviewdog:
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}

      - uses: reviewdog/action-clippy@v1
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added
          fail_level: ${{ inputs.fail-on-error && 'error' || 'none' }}
          workdir: ${{ inputs.working-directory }}
          clippy_flags: ${{ inputs.clippy-args }}
