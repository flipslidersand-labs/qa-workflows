name: Reviewdog Python (Reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: lint 対象ディレクトリ
        type: string
        default: "."
      fail-on-error:
        description: >-
          true なら lint エラーで CI を落とす。false（デフォルト）は
          PR にインラインコメントを付けるだけで CI は落とさない
          （Phase後半で true に切り替える運用を想定 #774）
        type: boolean
        default: false
      runner:
        description: >-
          実行 runner。未指定なら vars.GATE_RUNNER を使う
          （caller は通常渡さない）
        type: string
        default: ""
      timeout-minutes:
        description: >-
          job の最大実行時間（分）。超過すると job をキャンセルする
          （caller は通常渡さない）
        type: number
        default: 15

jobs:
  reviewdog:
    # caller の with で vars を参照すると解決に失敗するため、runner 選択は
    # reusable 側で行う（inputs.runner → vars.GATE_RUNNER）
    runs-on: ${{ inputs.runner != '' && inputs.runner || vars.GATE_RUNNER }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff --quiet

      - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1
        with:
          reviewdog_version: latest

      # reviewdog/action-ruff は存在しない（#774 実装時の誤り）。ruff は
      # reviewdog 連携用の rdjson 出力形式をネイティブサポートしているため、
      # reviewdog CLI に直接パイプする
      - name: ruff (reviewdog)
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ruff check --output-format=rdjson . | reviewdog \
            -f=rdjson \
            -name=ruff \
            -reporter=github-pr-review \
            -filter-mode=added \
            -fail-level=${{ inputs.fail-on-error && 'error' || 'none' }}
