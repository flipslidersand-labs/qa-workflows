name: Reviewdog Python (Reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: lint 対象ディレクトリ
        type: string
        default: "."
      fail-on-error:
        description: >-
          true なら lint エラーで CI を落とす。false（デフォルト）は
          PR にインラインコメントを付けるだけで CI は落とさない
          （Phase後半で true に切り替える運用を想定 #774）
        type: boolean
        default: false

jobs:
  reviewdog:
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: reviewdog/action-ruff@v1
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added
          fail_level: ${{ inputs.fail-on-error && 'error' || 'none' }}
          workdir: ${{ inputs.working-directory }}
