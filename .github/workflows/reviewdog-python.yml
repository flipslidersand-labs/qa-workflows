name: Reviewdog Python (Reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: lint 対象ディレクトリ
        type: string
        default: "."
      fail-on-error:
        description: >-
          true なら lint エラーで CI を落とす。false（デフォルト）は
          PR にインラインコメントを付けるだけで CI は落とさない
          （Phase後半で true に切り替える運用を想定 #774）
        type: boolean
        default: false

jobs:
  reviewdog:
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff --quiet

      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      # reviewdog/action-ruff は存在しない（#774 実装時の誤り）。ruff は
      # reviewdog 連携用の rdjson 出力形式をネイティブサポートしているため、
      # reviewdog CLI に直接パイプする
      - name: ruff (reviewdog)
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ruff check --output-format=rdjson . | reviewdog \
            -f=rdjson \
            -name=ruff \
            -reporter=github-pr-review \
            -filter-mode=added \
            -fail-level=${{ inputs.fail-on-error && 'error' || 'none' }}
