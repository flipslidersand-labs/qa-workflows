name: Python Test (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: Python バージョン
        type: string
        default: "3.12"
      coverage-threshold:
        description: カバレッジ閾値（%）
        type: number
        default: 60
      working-directory:
        description: テスト実行ディレクトリ
        type: string
        default: "."
      test-path:
        description: pytest の対象パス
        type: string
        default: "tests/"
      install-extras:
        description: pip install -e "[extras]" の extras 部分（install-command 未指定時のみ使用）
        type: string
        default: "dev"
      install-command:
        description: >-
          依存インストールコマンドの上書き。空なら `pip install -e ".[extras]"`。
          pyproject を持たない repo は `pip install -r requirements.txt` 等を渡す。
        type: string
        default: ""
      pre-install:
        description: '依存インストール前に実行する任意コマンド（例: torch CPU index の先入れ）'
        type: string
        default: ""
      pytest-args:
        description: 'pytest への追加引数（例: -k "not gpu"）'
        type: string
        default: ""
      run-tests:
        description: false なら pytest をスキップし lint/format のみのゲートにする
        type: boolean
        default: true
      run-lint:
        description: false なら ruff lint/format チェックをスキップする
        type: boolean
        default: true
      ruff-version:
        description: ruff の固定バージョン（空なら最新。CI の ruff 更新差分を避けたい時に固定）
        type: string
        default: ""
      runner:
        description: >-
          実行 runner。未指定なら vars.GATE_RUNNER →
          ubuntu-latest の順に自動選択（caller は通常渡さない）
        type: string
        default: ""
    secrets:
      token:
        required: false

jobs:
  test:
    runs-on: ${{ inputs.runner != '' && inputs.runner || vars.GATE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Pre-install
        if: ${{ inputs.pre-install != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.pre-install }}

      - name: Install dependencies (custom command)
        if: ${{ inputs.install-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}

      - name: Install dependencies
        if: ${{ inputs.install-command == '' }}
        working-directory: ${{ inputs.working-directory }}
        run: pip install -e ".[${{ inputs.install-extras }}]" --quiet

      - name: Lint (ruff)
        if: ${{ inputs.run-lint }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          RUFF_SPEC="ruff"
          if [ -n "${{ inputs.ruff-version }}" ]; then
            RUFF_SPEC="ruff==${{ inputs.ruff-version }}"
          fi
          pip install "$RUFF_SPEC" --quiet
          ruff check .
          ruff format --check .

      - name: Run tests
        if: ${{ inputs.run-tests }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          pytest ${{ inputs.test-path }} ${{ inputs.pytest-args }} \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=${{ inputs.coverage-threshold }} \
            -v

      - name: Upload coverage
        if: ${{ always() && inputs.run-tests }}
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ github.sha }}
          path: ${{ inputs.working-directory }}/coverage.xml
          retention-days: 7

      - name: PR coverage comment
        if: ${{ always() && inputs.run-tests && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const cov = path.join('${{ inputs.working-directory }}', 'coverage.xml');
            const MARKER = '<!-- qa-workflows-coverage-comment -->';
            let body;
            try {
              const xml = fs.readFileSync(cov, 'utf8');
              const m = xml.match(/line-rate="([0-9.]+)"/);
              if (!m) throw new Error('line-rate not found in coverage.xml');
              const pct = (parseFloat(m[1]) * 100).toFixed(1);
              const threshold = ${{ inputs.coverage-threshold }};
              const status = Number(pct) >= threshold ? '✅' : '❌';
              body = MARKER + '\n### 📊 Python coverage: **' + pct + '%** ' + status +
                '\n\n閾値: ' + threshold + '% | working-directory: `${{ inputs.working-directory }}`';
            } catch (e) {
              body = MARKER + '\n### 📊 Python coverage\ncoverage.xml の読み込みに失敗しました: ' + e.message;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
