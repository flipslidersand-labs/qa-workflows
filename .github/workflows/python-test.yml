name: Python Test (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: Python バージョン
        type: string
        default: "3.12"
      coverage-threshold:
        description: カバレッジ閾値（%）
        type: number
        default: 60
      working-directory:
        description: テスト実行ディレクトリ
        type: string
        default: "."
      test-path:
        description: pytest の対象パス
        type: string
        default: "tests/"
      install-extras:
        description: pip install -e "[extras]" の extras 部分（install-command 未指定時のみ使用）
        type: string
        default: "dev"
      install-command:
        description: >-
          依存インストールコマンドの上書き。空なら `pip install -e ".[extras]"`。
          pyproject を持たない repo は `pip install -r requirements.txt` 等を渡す。
        type: string
        default: ""
      pre-install:
        description: '依存インストール前に実行する任意コマンド（例: torch CPU index の先入れ）'
        type: string
        default: ""
      pytest-args:
        description: 'pytest への追加引数（例: -k "not gpu"）'
        type: string
        default: ""
      run-tests:
        description: false なら pytest をスキップし lint/format のみのゲートにする
        type: boolean
        default: true
      run-lint:
        description: false なら ruff lint/format チェックをスキップする
        type: boolean
        default: true
      ruff-version:
        description: >-
          ruff の固定バージョン。空なら caller の .pre-commit-config.yaml の
          ruff-pre-commit rev（先頭の v を除く）、それも無ければ最新
        type: string
        default: ""
      runner:
        description: >-
          実行 runner。未指定なら vars.GATE_RUNNER を使う
          （caller は通常渡さない）
        type: string
        default: ""
    secrets:
      token:
        required: false

jobs:
  test:
    runs-on: ${{ inputs.runner != '' && inputs.runner || vars.GATE_RUNNER }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          # self-hosted(ARC) は ~/.cache/pip が NFS 共有キャッシュのため GitHub cache は冗長。
          # 有効だと ~5GB を毎ジョブ restore/save し 1 ジョブ数十分 runner を占有する (#59)
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}

      - name: Pre-install
        if: ${{ inputs.pre-install != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.pre-install }}

      - name: Install dependencies (custom command)
        if: ${{ inputs.install-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}

      - name: Install dependencies
        if: ${{ inputs.install-command == '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          INSTALL_EXTRAS: ${{ inputs.install-extras }}
        run: pip install -e ".[${INSTALL_EXTRAS}]" --quiet

      - name: Lint (ruff)
        if: ${{ inputs.run-lint }}
        working-directory: ${{ inputs.working-directory }}
        env:
          RUFF_VERSION_INPUT: ${{ inputs.ruff-version }}
        run: |
          # 版の優先順位: ruff-version 入力 > .pre-commit-config.yaml の ruff-pre-commit rev > 最新 (#96)
          RUFF_VER="$RUFF_VERSION_INPUT"
          if [ -z "$RUFF_VER" ] && [ -f "$GITHUB_WORKSPACE/.pre-commit-config.yaml" ]; then
            # BEGIN ruff-rev-extract (tests/ruff-rev/run.sh がこの区間を抜き出して検証する)
            RUFF_VER="$(python3 - "$GITHUB_WORKSPACE/.pre-commit-config.yaml" <<'PY'
          import re, sys
          in_ruff = False
          for line in open(sys.argv[1], encoding="utf-8"):
              m = re.match(r"\s*-?\s*repo:\s*(\S+)", line)
              if m:
                  in_ruff = "ruff-pre-commit" in m.group(1)
                  continue
              m = re.match(r"\s*rev:\s*['\"]?([^'\"\s#]+)", line)
              if m and in_ruff:
                  print(m.group(1).lstrip("v"))
                  break
          PY
            )"
            # END ruff-rev-extract
            [ -n "$RUFF_VER" ] && echo "ruff ${RUFF_VER} (.pre-commit-config.yaml の rev から)"
          fi
          RUFF_SPEC="ruff"
          if [ -n "$RUFF_VER" ]; then
            RUFF_SPEC="ruff==${RUFF_VER}"
          fi
          pip install "$RUFF_SPEC" --quiet
          ruff check .
          ruff format --check .

      - name: Run tests
        if: ${{ inputs.run-tests }}
        working-directory: ${{ inputs.working-directory }}
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          pytest ${{ inputs.test-path }} ${{ inputs.pytest-args }} \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under="$COVERAGE_THRESHOLD" \
            -v

      - name: Upload coverage
        if: ${{ always() && inputs.run-tests }}
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-${{ github.sha }}
          path: ${{ inputs.working-directory }}/coverage.xml
          retention-days: 7

      - name: PR coverage comment
        if: ${{ always() && inputs.run-tests && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const cov = path.join(process.env.WORKING_DIRECTORY, 'coverage.xml');
            const MARKER = '<!-- qa-workflows-coverage-comment -->';
            let body;
            try {
              const xml = fs.readFileSync(cov, 'utf8');
              const m = xml.match(/line-rate="([0-9.]+)"/);
              if (!m) throw new Error('line-rate not found in coverage.xml');
              const pct = (parseFloat(m[1]) * 100).toFixed(1);
              const threshold = Number(process.env.COVERAGE_THRESHOLD);
              const status = Number(pct) >= threshold ? '✅' : '❌';
              body = MARKER + '\n### 📊 Python coverage: **' + pct + '%** ' + status +
                '\n\n閾値: ' + threshold + '% | working-directory: `' + process.env.WORKING_DIRECTORY + '`';
            } catch (e) {
              body = MARKER + '\n### 📊 Python coverage\ncoverage.xml の読み込みに失敗しました: ' + e.message;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
