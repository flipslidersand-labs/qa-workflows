name: Rust Test (Reusable)

on:
  workflow_call:
    inputs:
      rust-version:
        description: Rust toolchain（stable / 1.xx / nightly 等）
        type: string
        default: "stable"
      coverage-threshold:
        description: 最低カバレッジ（%）。run-coverage=true のとき cargo-llvm-cov で gate
        type: number
        default: 60
      test-args:
        description: cargo test / llvm-cov のスコープ引数（例 "--workspace" や "-p foo -p bar"）
        type: string
        default: "--workspace"
      clippy-args:
        description: cargo clippy のスコープ引数
        type: string
        default: "--workspace --all-targets"
      clippy-deny:
        description: clippy で deny する lint（-D で付与）
        type: string
        default: "warnings"
      working-directory:
        description: 実行ディレクトリ
        type: string
        default: "."
      runner:
        description: >-
          実行 runner。未指定なら vars.GATE_RUNNER を使う
          （caller は通常渡さない）
        type: string
        default: ""
      system-deps:
        description: 事前に apt-get install する追加パッケージ（空でスキップ）
        type: string
        default: ""
      rust-targets:
        description: 追加インストールする rustup target（カンマ区切り。例 "wasm32-wasip1"。空でスキップ）
        type: string
        default: ""
      pre-install:
        description: 依存導入後・テスト前に実行する任意コマンド（例 "pip install pytest"。空でスキップ）
        type: string
        default: ""
      run-fmt:
        description: cargo fmt --check を実行するか
        type: boolean
        default: true
      run-clippy:
        description: cargo clippy を実行するか
        type: boolean
        default: true
      run-tests:
        description: テストを実行するか（false なら fmt/clippy/build のみ）
        type: boolean
        default: true
      run-coverage:
        description: cargo-llvm-cov で coverage を計測・gate するか（false なら cargo test のみ）
        type: boolean
        default: true
      timeout-minutes:
        description: >-
          job の最大実行時間（分）。超過すると job をキャンセルする
          （caller は通常渡さない）
        type: number
        default: 45
    secrets:
      token:
        description: GitHub token（必要な場合）
        required: false

jobs:
  test:
    # caller の with で vars を参照すると解決に失敗するため、runner 選択は
    # reusable 側で行う（inputs.runner → vars.GATE_RUNNER）
    runs-on: ${{ inputs.runner != '' && inputs.runner || vars.GATE_RUNNER }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ inputs.rust-version }}
          components: rustfmt, clippy, llvm-tools-preview
          targets: ${{ inputs.rust-targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ inputs.working-directory }}

      - name: Install system deps
        if: ${{ inputs.system-deps != '' }}
        env:
          SYSTEM_DEPS: ${{ inputs.system-deps }}
        run: |
          read -r -a DEPS <<< "$SYSTEM_DEPS"
          sudo apt-get update && sudo apt-get install -y "${DEPS[@]}"

      - name: Pre-install
        if: ${{ inputs.pre-install != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.pre-install }}

      - name: cargo fmt --check
        if: ${{ inputs.run-fmt }}
        working-directory: ${{ inputs.working-directory }}
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: ${{ inputs.run-clippy }}
        working-directory: ${{ inputs.working-directory }}
        env:
          CLIPPY_ARGS: ${{ inputs.clippy-args }}
          CLIPPY_DENY: ${{ inputs.clippy-deny }}
        run: |
          read -r -a CLIPPY_ARR <<< "$CLIPPY_ARGS"
          read -r -a DENY_ARR <<< "$CLIPPY_DENY"
          cargo clippy "${CLIPPY_ARR[@]}" -- -D "${DENY_ARR[@]}"

      - name: cargo build
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_ARGS: ${{ inputs.test-args }}
        run: |
          read -r -a TEST_ARR <<< "$TEST_ARGS"
          cargo build "${TEST_ARR[@]}"

      - name: Install cargo-llvm-cov
        if: ${{ inputs.run-tests && inputs.run-coverage }}
        uses: taiki-e/install-action@7ba3421b00d46a29aaedcfe59124f4574e23e73e # cargo-llvm-cov

      - name: Test + coverage
        if: ${{ inputs.run-tests && inputs.run-coverage }}
        working-directory: ${{ inputs.working-directory }}
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
          TEST_ARGS: ${{ inputs.test-args }}
        run: |
          read -r -a TEST_ARR <<< "$TEST_ARGS"
          cargo llvm-cov "${TEST_ARR[@]}" \
            --lcov --output-path lcov.info \
            --fail-under-lines "$COVERAGE_THRESHOLD"

      - name: Test (no coverage)
        if: ${{ inputs.run-tests && ! inputs.run-coverage }}
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_ARGS: ${{ inputs.test-args }}
        run: |
          read -r -a TEST_ARR <<< "$TEST_ARGS"
          cargo test "${TEST_ARR[@]}"

      - name: Upload coverage
        if: ${{ always() && inputs.run-tests && inputs.run-coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage-${{ github.sha }}
          path: ${{ inputs.working-directory }}/lcov.info
          retention-days: 7

      - name: PR coverage comment
        if: ${{ always() && inputs.run-coverage && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const lcov = path.join(process.env.WORKING_DIRECTORY, 'lcov.info');
            const MARKER = '<!-- qa-workflows-coverage-comment -->';
            let body;
            try {
              const text = fs.readFileSync(lcov, 'utf8');
              let lh = 0, lf = 0;
              for (const line of text.split('\n')) {
                if (line.startsWith('LH:')) lh += parseInt(line.slice(3), 10) || 0;
                if (line.startsWith('LF:')) lf += parseInt(line.slice(3), 10) || 0;
              }
              if (lf === 0) throw new Error('lcov.info に LF レコードが無い');
              const pct = ((lh / lf) * 100).toFixed(1);
              const threshold = Number(process.env.COVERAGE_THRESHOLD);
              const status = Number(pct) >= threshold ? '✅' : '❌';
              body = MARKER + '\n### 📊 Rust coverage: **' + pct + '%** ' + status +
                '\n\n閾値: ' + threshold + '% | working-directory: `' + process.env.WORKING_DIRECTORY + '`';
            } catch (e) {
              body = MARKER + '\n### 📊 Rust coverage\nlcov.info の読み込みに失敗しました: ' + e.message;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
