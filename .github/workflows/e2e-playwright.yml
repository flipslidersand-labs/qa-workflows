name: E2E Playwright

on:
  workflow_call:
    inputs:
      app-dir:
        description: "Path to the app directory (relative to repo root)"
        type: string
        default: "."
      base-url:
        description: "URL the app will be served at inside Docker network"
        type: string
        default: "http://app:5173"
      node-version:
        type: string
        default: "20"
    secrets:
      # Pass any app-level secrets needed at runtime
      APP_ENV:
        required: false

jobs:
  e2e:
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Playwright E2E
        env:
          APP_DIR: ${{ inputs.app-dir }}
          BASE_URL: ${{ inputs.base-url }}
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          docker compose \
            -f infra/playwright/docker-compose.yml \
            run --rm playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            infra/playwright/playwright-report/
            infra/playwright/test-results/
          retention-days: 7
