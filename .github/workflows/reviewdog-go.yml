name: Reviewdog Go (Reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: lint 対象ディレクトリ
        type: string
        default: "."
      go-version:
        description: Go バージョン
        type: string
        default: "1.23"
      fail-on-error:
        description: >-
          true なら lint エラーで CI を落とす。false（デフォルト）は
          PR にインラインコメントを付けるだけで CI は落とさない
          （Phase後半で true に切り替える運用を想定 #774）
        type: boolean
        default: false
      runner:
        description: >-
          実行 runner。未指定なら vars.GATE_RUNNER を使う
          （caller は通常渡さない）
        type: string
        default: ""
      timeout-minutes:
        description: >-
          job の最大実行時間（分）。超過すると job をキャンセルする
          （caller は通常渡さない）
        type: number
        default: 15

jobs:
  reviewdog:
    # caller の with で vars を参照すると解決に失敗するため、runner 選択は
    # reusable 側で行う（inputs.runner → vars.GATE_RUNNER）
    runs-on: ${{ inputs.runner != '' && inputs.runner || vars.GATE_RUNNER }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          # self-hosted(ARC) は ~/.cache が共有でパーミッション競合しうるため無効化 (#88, python-test #59 と同方針)
          cache: ${{ runner.environment == 'github-hosted' }}

      - uses: reviewdog/action-golangci-lint@284129a3ac23bc5d8ac1522e0b6511df74a8836d # v2
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added
          fail_level: ${{ inputs.fail-on-error && 'error' || 'none' }}
          workdir: ${{ inputs.working-directory }}
