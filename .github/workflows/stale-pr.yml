name: Stale PR (Reusable)

# 呼び出し側で必ず job-level permissions (pull-requests: write, issues: write)
# を宣言すること。このファイル自身は permissions を要求しない
# （#772/#774 のインシデントで学んだ教訓: reusable workflow がここで
# permissions を要求すると、呼び出し元が宣言していない場合に GitHub が
# ワークフロー全体のスケジュールを拒否する）

on:
  workflow_call:
    inputs:
      days-before-stale:
        description: 何日更新が無ければ stale ラベルを付けるか
        type: number
        default: 14
      days-before-close:
        description: stale 後、何日でクローズするか
        type: number
        default: 7
      days-before-issue-stale:
        description: >-
          Issue を何日更新が無ければ stale にするか。-1 で Issue は対象外（既定。
          従来の caller の挙動を変えない）
        type: number
        default: -1
      days-before-issue-close:
        description: Issue が stale になってから何日でクローズするか。-1 でクローズしない
        type: number
        default: -1
      timeout-minutes:
        description: >-
          job の最大実行時間（分）。超過すると job をキャンセルする
          （caller は通常渡さない）
        type: number
        default: 10

jobs:
  stale:
    runs-on: ${{ vars.GATE_RUNNER }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/stale@v11
        with:
          days-before-pr-stale: ${{ inputs.days-before-stale }}
          days-before-pr-close: ${{ inputs.days-before-close }}
          stale-pr-label: stale
          exempt-pr-labels: keep-alive
          # Issue 側は既定で対象外（-1）。滞留整理したいリポだけ input で有効にする
          # （dev-platform#2360。値は dev-platform の stale.yml と同じ 60/30 を推奨）
          days-before-issue-stale: ${{ inputs.days-before-issue-stale }}
          days-before-issue-close: ${{ inputs.days-before-issue-close }}
          stale-issue-label: stale
          exempt-issue-labels: "keep-open,epic,needs-human"
          stale-issue-message: >-
            この Issue は${{ inputs.days-before-issue-stale }}日間更新がありません。
            ${{ inputs.days-before-issue-close }}日以内に更新がなければクローズします（reopen で復活できます）。
            残す場合はコメントするか `keep-open` ラベルを付けてください。
          close-issue-message: >-
            更新がなかったためクローズしました。再開する場合は reopen してください。
          close-issue-reason: not_planned
          stale-pr-message: >-
            このPRは${{ inputs.days-before-stale }}日間更新がありません。
            ${{ inputs.days-before-close }}日以内にアクションがなければクローズします。
            続ける場合はコメントするか `keep-alive` ラベルを付けてください。
          close-pr-message: >-
            アクションが無いためクローズしました。再開する場合は再オープンしてください。
