name: PR Title (self)

# qa-workflows 自身の PR で pr-title.yml の動作確認をする呼び出し。
# 必須チェックにはしない（branch protection に追加しない）。
# check 名: pr-title / pr-title-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    permissions:
      contents: read
    uses: ./.github/workflows/pr-title.yml
